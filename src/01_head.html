<title>Circuit Data Analyzer</title>
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>
:root{
  --bg:#0d1014; --bg2:#141920; --bg3:#1b222c; --line:#28313d; --line2:#3a4655;
  --fg:#e8edf4; --fg2:#9aa8ba; --fg3:#6c7a8c;
  --accent:#38bdf8; --good:#4ade80; --warn:#fbbf24; --bad:#f87171; --purple:#c084fc;
  --mono:ui-monospace,"SF Mono",Menlo,Consolas,"Roboto Mono",monospace;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","Hiragino Sans","Noto Sans JP",sans-serif;
  --hdr:44px;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--fg);font-family:var(--sans);font-size:13px;overflow:hidden;overscroll-behavior:none}
button{font:inherit;color:inherit;background:var(--bg3);border:1px solid var(--line2);border-radius:6px;padding:5px 10px;cursor:pointer}
button:hover{background:var(--line)}
button.on{background:var(--accent);border-color:var(--accent);color:#04121c;font-weight:700}
button:disabled{opacity:.4;cursor:default}
select,input[type=text],input[type=number],textarea{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line2);border-radius:6px;padding:5px 7px}
textarea{width:100%;resize:vertical;line-height:1.55;font-size:12.5px}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
.hide{display:none !important}
::-webkit-scrollbar{width:9px;height:9px}
::-webkit-scrollbar-thumb{background:var(--line2);border-radius:5px}
::-webkit-scrollbar-track{background:transparent}

#app{display:flex;flex-direction:column;height:100%}
#topbar{height:var(--hdr);flex:0 0 auto;display:flex;align-items:center;gap:8px;padding:0 10px;
  background:var(--bg2);border-bottom:1px solid var(--line)}
#logo{font-weight:800;letter-spacing:.06em;font-size:13px;color:var(--accent);white-space:nowrap}
#logo small{color:var(--fg3);font-weight:600;letter-spacing:0}
#sessName{color:var(--fg2);font-size:12px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1 1 auto;min-width:0}

#sessChips{flex:0 0 auto;display:flex;gap:6px;padding:5px 10px;background:var(--bg2);
  border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none}
#sessChips::-webkit-scrollbar{display:none}
.chip{display:inline-flex;align-items:center;gap:6px;flex:0 0 auto;padding:3px 8px;border-radius:20px;
  background:var(--bg3);border:1px solid var(--line2);font-size:11.5px;white-space:nowrap}
.chip b{color:var(--accent);font-size:12px}
.chip .bt{font-family:var(--mono);color:var(--fg3)}
.chip button{padding:0 4px;border:0;background:transparent;color:var(--fg3);font-size:13px;line-height:1;border-radius:4px}
.chip button:hover{background:var(--bad);color:#fff}
table.lt tr.shead td{background:var(--bg3);color:var(--accent);font-weight:700;font-size:11px;
  letter-spacing:.04em;padding:4px 6px;cursor:default}
table.lt tr.shead:hover td{background:var(--bg3)}

#kpi{flex:0 0 auto;display:flex;background:var(--bg2);border-bottom:1px solid var(--line);
  overflow-x:auto;scrollbar-width:none}
#kpi::-webkit-scrollbar{display:none}
.kv{padding:5px 12px;border-right:1px solid var(--line);min-width:82px;flex:0 0 auto}
.kv .k{font-size:9.5px;letter-spacing:.09em;color:var(--fg3);text-transform:uppercase;white-space:nowrap}
.kv .v{font-family:var(--mono);font-size:16px;font-weight:700;line-height:1.25;white-space:nowrap}
.kv .v.sm{font-size:13px;font-weight:600}

#main{flex:1 1 auto;display:grid;grid-template-columns:minmax(300px,26vw) 1fr;min-height:0}
#left{display:flex;flex-direction:column;border-right:1px solid var(--line);min-height:0;min-width:0}
#right{display:flex;flex-direction:column;min-height:0;min-width:0}
.panel{display:flex;flex-direction:column;min-height:0}
.ph{flex:0 0 auto;display:flex;align-items:center;gap:6px;padding:5px 9px;background:var(--bg2);
  border-bottom:1px solid var(--line);font-size:10.5px;letter-spacing:.09em;color:var(--fg3);text-transform:uppercase}
.ph .sp{flex:1}
.ph button{padding:2px 7px;font-size:11px;letter-spacing:0;text-transform:none}

#vidPanel{flex:0 0 auto;border-bottom:1px solid var(--line)}
#vidStage{position:relative;width:100%;aspect-ratio:16/9;background:#000;overflow:hidden}
#vidStage>video,#vidStage>iframe,#vidStage>div#vidYT{position:absolute;inset:0;width:100%;height:100%;border:0;display:block}
#vidYT iframe{width:100%;height:100%}
#vidEmpty{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  gap:7px;padding:12px;text-align:center;background:#0a0d11}
#vidEmpty .or{color:var(--fg3);font-size:11px}
#vidEmpty .note{color:var(--fg3);font-size:10.5px;line-height:1.5}
.urow{display:flex;gap:5px;align-items:center;flex-wrap:wrap;justify-content:center}
#vidUrl{min-width:150px;flex:1 1 150px;font-size:11.5px}
#vidBar{padding:6px 8px;background:var(--bg2);display:flex;flex-direction:column;gap:5px}
#vidBar button{padding:3px 8px;font-size:11.5px}
#vidInfo{font-size:11px;color:var(--fg2);font-family:var(--mono);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#vidClips{display:flex;gap:4px;flex-wrap:wrap}
.vclip{padding:2px 7px !important;font-size:11px !important;border-radius:20px}
.vclip.ok{border-color:var(--good)}
.vclip.on{background:var(--accent);border-color:var(--accent);color:#04121c;font-weight:700}
#vidMsg{margin-top:0;font-size:11px}

#mapPanel{flex:1 1 46%;min-height:170px}
#mapWrap{position:relative;flex:1 1 auto;min-height:0;background:#0a0d11}
#map{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block}
#tabsPanel{flex:1 1 54%;min-height:0;border-top:1px solid var(--line)}
#tabbar{flex:0 0 auto;display:flex;background:var(--bg2);border-bottom:1px solid var(--line)}
#tabbar button{border:0;border-radius:0;background:transparent;color:var(--fg3);padding:7px 11px;font-size:11.5px;
  border-bottom:2px solid transparent;font-weight:600}
#tabbar button.on{color:var(--fg);border-bottom-color:var(--accent);background:transparent}
.tabbody{flex:1 1 auto;overflow:auto;min-height:0;padding:8px}

#chartWrap{position:relative;flex:1 1 auto;min-height:0;background:var(--bg)}
#chart{position:absolute;inset:0;width:100%;height:100%;touch-action:none;display:block;cursor:crosshair}

table.lt{width:100%;border-collapse:collapse;font-size:12px}
table.lt th{position:sticky;top:0;background:var(--bg2);color:var(--fg3);font-size:9.5px;letter-spacing:.07em;
  text-transform:uppercase;text-align:right;padding:4px 5px;border-bottom:1px solid var(--line);z-index:2;font-weight:600}
table.lt th:first-child,table.lt td:first-child{text-align:left}
table.lt td{padding:3px 5px;text-align:right;border-bottom:1px solid #1a212a;font-family:var(--mono);
  font-variant-numeric:tabular-nums;white-space:nowrap}
table.lt tr{cursor:pointer}
table.lt tr:hover td{background:#1a212b}
table.lt tr.sel td{background:#182634}
table.lt tr.ref td{background:#1d2a1f}
table.lt tr.out td{color:var(--fg3)}
.swatch{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:5px;vertical-align:-1px;background:#333}
.best{color:var(--purple);font-weight:700}

.chrow{display:flex;align-items:center;gap:7px;padding:5px 6px;border-bottom:1px solid #1a212a}
.chrow .nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chrow input[type=checkbox]{accent-color:var(--accent);width:15px;height:15px}
.chrow .u{color:var(--fg3);font-size:11px;font-family:var(--mono)}

.fld{margin-bottom:11px}
.fld label{display:block;color:var(--fg2);font-size:11px;margin-bottom:3px}
.fld .row{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.fld input[type=text],.fld input[type=number],.fld select{width:100%}
.note{color:var(--fg3);font-size:11px;line-height:1.6;margin:6px 0}
hr.sep{border:0;border-top:1px solid var(--line);margin:12px 0}
h4{margin:0 0 7px;font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--fg3)}

#drop{position:fixed;inset:0;background:rgba(6,10,14,.97);z-index:60;display:flex;align-items:center;
  justify-content:center;padding:20px;overflow:auto}
#drop .box{max-width:640px;width:100%;text-align:center}
#drop h1{font-size:22px;margin:0 0 4px;letter-spacing:.02em}
#drop h1 span{color:var(--accent)}
#drop p{color:var(--fg2);line-height:1.75;margin:6px 0}
#dz{border:2px dashed var(--line2);border-radius:14px;padding:34px 20px;margin:18px 0;background:var(--bg2);
  transition:.15s;cursor:pointer}
#dz.hot{border-color:var(--accent);background:#132430}
#dz .big{font-size:15px;font-weight:700;margin-bottom:6px}
#prog{margin-top:14px;color:var(--accent);font-family:var(--mono);font-size:12px;min-height:18px}
#bar{height:3px;background:var(--bg3);border-radius:2px;overflow:hidden;margin-top:8px}
#bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .15s}
.err{color:var(--bad);text-align:left;background:#221313;border:1px solid #4a2020;border-radius:8px;
  padding:10px 12px;margin-top:12px;line-height:1.7;font-size:12px;white-space:pre-wrap}
#recent{display:flex;flex-direction:column;gap:6px;margin-top:10px}
#recent button{text-align:left;font-size:12px}

.modal{position:fixed;inset:0;background:rgba(4,7,10,.8);z-index:70;display:flex;align-items:center;
  justify-content:center;padding:16px}
.modal .card{background:var(--bg2);border:1px solid var(--line2);border-radius:12px;max-width:760px;width:100%;
  max-height:88vh;overflow:auto;padding:18px}
.modal h3{margin:0 0 10px;font-size:15px}
.mapgrid{display:grid;grid-template-columns:1fr 1fr;gap:7px;align-items:center;font-size:12px}
.mapgrid .lbl{color:var(--fg2)}
.actions{display:flex;gap:8px;justify-content:flex-end;margin-top:14px;flex-wrap:wrap}

#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:22px;background:var(--bg3);
  border:1px solid var(--line2);border-radius:8px;padding:8px 14px;z-index:90;font-size:12.5px;
  opacity:0;transition:.2s;pointer-events:none;max-width:90vw;text-align:center}
#toast.show{opacity:1}

@media (max-width:820px){
  :root{--hdr:40px}
  body{font-size:12.5px}
  /* One scrolling column. #left becomes display:contents so the map, the graphs
     and the tab panel are all direct children and can be reordered - the map
     must sit immediately above the graphs, not above the lap table. */
  #main{display:flex;flex-direction:column;overflow-y:auto;-webkit-overflow-scrolling:touch}
  #left{display:contents}
  #vidPanel{order:0;flex:0 0 auto}
  #mapPanel{order:1;flex:0 0 auto;height:34vh;min-height:200px;border-bottom:1px solid var(--line)}
  #right{order:2;flex:0 0 auto;height:80vh;min-height:340px}
  #tabsPanel{order:3;flex:0 0 auto;height:58vh;min-height:300px;border-top:1px solid var(--line)}
  .kv{min-width:70px;padding:4px 9px}
  .kv .v{font-size:14px}
  #logo small{display:none}
}
</style>
